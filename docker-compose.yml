version: '3.9'

services:
  mongo:
    image: mongo:7
    ports: ['27017:27017']
    volumes: ['mongo-data:/data/db']

  redis:
    image: redis:7-alpine
    ports: ['6379:6379']

  server:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    ports: ['3001:3001']
    volumes:
      - ./server/src:/app/src
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - MONGO_URI=mongodb://mongo:27017/collab-editor
      - REDIS_URL=redis://redis:6379
      - CLIENT_ORIGIN=http://localhost:5173
    depends_on: [mongo, redis]

  client:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    ports: ['5173:5173']
    volumes: ['./client/src:/app/src']
    depends_on: [server]

volumes:
  mongo-data: